name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Type check
        run: pnpm run type-check

      - name: Build
        run: pnpm run build

      - name: CLI package smoke test
        run: ./scripts/cli-package-smoke.sh

      - name: Test
        run: pnpm run test:unit

  # Required: the network-free regression guard against a real Agave validator.
  integration-validator:
    needs: build-and-unit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Solana CLI
        uses: ./.github/actions/setup-solana

      - name: Test Integration
        run: pnpm run test:integration

  # Surfpool forks devnet, so it also runs the SRFC-37 (Token ACL / ABL) and Token-2022 v11 suites
  # the validator can't. Not required yet: it depends on a remote datasource, so it stays
  # continue-on-error until it has a run of consistently green builds on main.
  integration-surfpool:
    needs: build-and-unit
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write # Doppler OIDC auth

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup surfpool
        uses: ./.github/actions/setup-surfpool

      # A private devnet RPC (RPC_URL + RPC_KEY) avoids public-devnet rate limits. Fork PRs get
      # no OIDC token and forks have no identity configured, so they skip this and the runner
      # falls back to public devnet.
      - name: Fetch Doppler secrets
        if: vars.DOPPLER_SERVICE_IDENTITY_ID != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_SERVICE_IDENTITY_ID }}
          doppler-project: ${{ vars.DOPPLER_PROJECT || 'mosaic' }}
          doppler-config: ${{ vars.DOPPLER_CONFIG_CI || 'stg' }}
          inject-env-vars: true

      - name: Test Integration (surfpool)
        run: |
          if [ -n "${RPC_URL:-}" ] && [ -n "${RPC_KEY:-}" ]; then
            export SURFPOOL_DATASOURCE_RPC_URL="${RPC_URL}${RPC_KEY}"
          fi
          pnpm run test:integration:surfpool
